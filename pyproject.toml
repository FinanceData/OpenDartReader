[project]
name = "opendartreader"
version = "0.3.3"
description = "OpenDART 공시정보를 쉽게 조회할 수 있는 파이썬 라이브러리"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "click>=8.3.3",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
dart = "opendartreader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opendartreader"]

[tool.pytest.ini_options]
testpaths = ["opendartreader/tests"]
norecursedirs = [".venv", "dist", "build"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]


